<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craster Parabolic - 중심 좌표 사용자 정의 세계지도</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 1rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="number"] {
            background: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            width: 90px;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0284c7;
            color: #fff;
        }

        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 1rem;
        }

        canvas {
            background-color: #020617;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .info-box {
            position: absolute;
            bottom: 1.5rem;
            left: 1.5rem;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(4px);
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
            font-size: 0.8rem;
            border: 1px solid #334155;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Craster Parabolic 중심 변경 지도</h1>
        <div class="input-group">
            <label for="center-lat">중심 위도(Lat):</label>
            <input type="number" id="center-lat" value="36.78" step="0.01" min="-90" max="90">
        </div>
        <div class="input-group">
            <label for="center-lon">중심 경도(Lon):</label>
            <input type="number" id="center-lon" value="126.15" step="0.01" min="-180" max="180">
        </div>
        <button id="update-btn">지도 재투영</button>
        <button id="reset-btn" style="background:#64748b; color:#fff;">태안(만리포) 설정</button>
    </header>

    <div id="canvas-container">
        <canvas id="mapCanvas"></canvas>
        <div class="info-box">
            • <b>중심점(0,0)</b>: 지정한 GPS 좌표<br>
            • <b>투영 알고리즘</b>: Craster Parabolic (등면적 포물선 투영)<br>
            • 빨간 십자선: 재설정된 중심 원점
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        // 입력 엘리먼트
        const latInput = document.getElementById('center-lat');
        const lonInput = document.getElementById('center-lon');
        const updateBtn = document.getElementById('update-btn');
        const resetBtn = document.getElementById('reset-btn');

        // 내장 간단한 대륙 윤곽선 데이터 (샘플 위경도 폴리곤 데이터)
        // 실제 정밀 지도를 위해 주요 대륙 좌표셋 포함
        const landFeatures = [
            // 아시아 & 유럽 & 아프리카 (구대륙 간략화)
            [[35,140],[60,170],[70,100],[70,40],[40,30],[30,35],[15,45],[10,75],[20,80],[25,120],[35,140]],
            [[35,10],[10,14],[0,9],[ -30,18],[-34,26],[5,48],[30,32],[36,5],[35,10]],
            [[60,5],[50,30],[40,25],[40,0],[50,-10],[60,5]],
            // 한반도 주변
            [[38,126],[40,129],[38,129],[35,129],[34,126],[38,126]],
            // 아메리카
            [[65,-168],[70,-100],[50,-55],[30,-80],[25,-98],[55,-130],[65,-168]],
            [[10,-75],[-10,-40],[-35,-55],[-53,-70],[-18,-70],[0,-80],[10,-75]],
            // 호주
            [[-12,130],[-15,145],[-35,150],[-35,115],[-22,114],[-12,130]],
            // 남극
            [[-70,0],[-70,90],[-70,180],[-70,-90],[-70,0]]
        ];

        // 캔버스 크기 조정
        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const w = container.clientWidth - 32;
            const h = container.clientHeight - 32;
            
            // 크라스터 포물선 투영의 종횡비는 2:1
            if (w / h > 2) {
                canvas.height = h;
                canvas.width = h * 2;
            } else {
                canvas.width = w;
                canvas.height = w / 2;
            }
            render();
        }

        // 구면 회전 변환: 지정한 (centerLat, centerLon)을 (0,0)으로 이동
        function rotateSpherical(lat, lon, centerLat, centerLon) {
            const deg2rad = Math.PI / 180;
            const rad2deg = 180 / Math.PI;

            let phi = lat * deg2rad;
            let lambda = lon * deg2rad;
            let phi0 = centerLat * deg2rad;
            let lambda0 = centerLon * deg2rad;

            // 구면 좌표계 회전 공식 (Euler Rotation)
            let dLambda = lambda - lambda0;

            let sinPhi = Math.sin(phi0) * Math.sin(phi) + Math.cos(phi0) * Math.cos(phi) * Math.cos(dLambda);
            sinPhi = Math.max(-1, Math.min(1, sinPhi)); // Clamp
            let newLat = Math.asin(sinPhi);

            let y = Math.cos(phi) * Math.sin(dLambda);
            let x = Math.cos(phi0) * Math.sin(phi) - Math.sin(phi0) * Math.cos(phi) * Math.cos(dLambda);
            let newLon = Math.atan2(y, x);

            return {
                lat: newLat * rad2deg,
                lon: newLon * rad2deg
            };
        }

        // Craster Parabolic 투영 공식
        function projectCrasterParabolic(lat, lon, width, height) {
            const deg2rad = Math.PI / 180;
            const phi = lat * deg2rad;
            const lambda = lon * deg2rad;

            // 스케일 인자 (반지름 R 역할)
            const R = height / 3.06; // 수학적 경계에 맞춤

            // 크라스터 포물선 수식
            // x = 3 * R * lambda * sqrt(1/3pi) * (2 * cos(2phi/3) - 1)
            // y = R * sqrt(3pi) * sin(phi/3)
            const sqrt_1_3pi = Math.sqrt(1 / (3 * Math.PI));
            const sqrt_3pi = Math.sqrt(3 * Math.PI);

            const x = 3 * R * lambda * sqrt_1_3pi * (2 * Math.cos((2 * phi) / 3) - 1);
            const y = R * sqrt_3pi * Math.sin(phi / 3);

            // Canvas 화면 중앙 (0,0) 좌표로 변환 및 Y축 반전
            return {
                x: width / 2 + x,
                y: height / 2 - y
            };
        }

        // 전체 지도 그리기
        function render() {
            const width = canvas.width;
            const height = canvas.height;

            const centerLat = parseFloat(latInput.value) || 0;
            const centerLon = parseFloat(lonInput.value) || 0;

            ctx.clearRect(0, 0, width, height);

            // 1. 위경도 격자(Graticule) 그리기
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;

            // 경선 (Longitude)
            for (let lon = -180; lon <= 180; lon += 30) {
                ctx.beginPath();
                let first = true;
                for (let lat = -90; lat <= 90; lat += 5) {
                    const rot = rotateSpherical(lat, lon, centerLat, centerLon);
                    const pt = projectCrasterParabolic(rot.lat, rot.lon, width, height);
                    if (first) { ctx.moveTo(pt.x, pt.y); first = false; }
                    else { ctx.lineTo(pt.x, pt.y); }
                }
                ctx.stroke();
            }

            // 위선 (Latitude)
            for (let lat = -80; lat <= 80; lat += 20) {
                ctx.beginPath();
                let first = true;
                for (let lon = -180; lon <= 180; lon += 5) {
                    const rot = rotateSpherical(lat, lon, centerLat, centerLon);
                    const pt = projectCrasterParabolic(rot.lat, rot.lon, width, height);
                    if (first) { ctx.moveTo(pt.x, pt.y); first = false; }
                    else { ctx.lineTo(pt.x, pt.y); }
                }
                ctx.stroke();
            }

            // 2. 대륙 도형 그리기
            ctx.fillStyle = '#334155';
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 1.5;

            landFeatures.forEach(poly => {
                ctx.beginPath();
                let first = true;
                poly.forEach(coord => {
                    const rot = rotateSpherical(coord[0], coord[1], centerLat, centerLon);
                    const pt = projectCrasterParabolic(rot.lat, rot.lon, width, height);
                    if (first) { ctx.moveTo(pt.x, pt.y); first = false; }
                    else { ctx.lineTo(pt.x, pt.y); }
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });

            // 3. 중심점 (0,0) 조준선 표시
            const centerPt = projectCrasterParabolic(0, 0, width, height);
            
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            
            // 십자선
            ctx.beginPath();
            ctx.moveTo(centerPt.x - 12, centerPt.y);
            ctx.lineTo(centerPt.x + 12, centerPt.y);
            ctx.moveTo(centerPt.x, centerPt.y - 12);
            ctx.lineTo(centerPt.x, centerPt.y + 12);
            ctx.stroke();

            // 중심점 포인트
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(centerPt.x, centerPt.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // 이벤트 리스너 등록
        updateBtn.addEventListener('click', render);
        resetBtn.addEventListener('click', () => {
            latInput.value = 36.78;
            lonInput.value = 126.15;
            render();
        });

        window.addEventListener('resize', resizeCanvas);

        // 초기 실행
        resizeCanvas();
    </script>
</body>
</html>
