<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지구 구면직각삼각형 8개 중심점 모니터링</title>
<style>
:root {
  --bg: #050d1a;
  --panel: #0a192f;
  --panel-border: #17385c;
  --cyan: #4dd8ff;
  --gold: #ffd45a;
  --red: #ff6675;
  --green: #5fe0a2;
  --text: #eef7ff;
  --muted: #8aa4be;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 16px 24px;
  background: rgba(10, 25, 47, 0.95);
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.brand h1 { margin: 0; font-size: 20px; color: var(--cyan); }
.brand p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

.header-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}
select.lang-select {
  background: #071827;
  color: var(--cyan);
  border: 1px solid var(--panel-border);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  outline: none;
}
select.lang-select:hover {
  border-color: var(--cyan);
}

.status-badge {
  background: rgba(77, 216, 255, 0.1);
  border: 1px solid var(--cyan);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 12px;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 8px;
}
.pulse-dot {
  width: 8px;
  height: 8px;
  background-color: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}

main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 390px;
  gap: 16px;
  padding: 16px;
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
}

.map-container {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.map-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  background: rgba(0,0,0,0.2);
}
#mapCanvas {
  width: 100%;
  height: 100%;
  min-height: 450px;
  display: block;
  background: #020914;
}

.side-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
}
.card {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 16px;
}
.card h2 {
  font-size: 14px;
  margin: 0 0 12px;
  color: var(--cyan);
  display: flex;
  justify-content: space-between;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th, td {
  padding: 8px 6px;
  border-bottom: 1px solid rgba(23, 56, 92, 0.6);
  text-align: center;
}
th {
  color: var(--muted);
  font-weight: 500;
  background: rgba(0,0,0,0.2);
}
.center-name {
  font-weight: bold;
  color: var(--gold);
}
.coord-val {
  font-family: monospace;
}

.math-info {
  font-size: 11px;
  line-height: 1.6;
  color: var(--muted);
}
.math-info strong { color: var(--text); }
.math-eq {
  background: #051324;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid #143556;
  font-family: "Georgia", serif;
  margin: 6px 0;
  color: #d1e8ff;
}

@media (max-width: 1024px) {
  main { grid-template-columns: 1fr; }
  .side-panel { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1 id="t-title">지구 구면직각삼각형 8대 중심점 모니터링</h1>
    <p id="t-subtitle">북위/남위 35.26° & 동경/서경 45°, 135° 기준 회전 변환 및 평면 투영 모델</p>
  </div>
  <div class="header-controls">
    <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
      <option value="ko" selected>한국어 (Korean)</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt (Vietnamese)</option>
    </select>
    <div class="status-badge">
      <div class="pulse-dot"></div>
      <span id="t-live-label">실시간 추적 중:</span> <strong id="liveTimer">00:00:00</strong>
    </div>
  </div>
</header>

<main>
  <!-- 지도 화면 영역 -->
  <div class="map-container">
    <div class="map-header">
      <span id="t-map-title"><strong>세계 지도 투영</strong> (북위 35°, 동경 45° 회전 관점)</span>
      <span style="color:var(--gold);" id="t-points-count">● 8개 중심점 표시 중</span>
    </div>
    <canvas id="mapCanvas"></canvas>
  </div>

  <!-- 우측 정보 패널 -->
  <div class="side-panel">
    <!-- 8곳 좌표 테이블 -->
    <div class="card">
      <h2 id="t-table-title">구면직각삼각형 중심점 8곳 GPS</h2>
      <table>
        <thead>
          <tr>
            <th id="th-zone">구역</th>
            <th id="th-lat">위도(Lat)</th>
            <th id="th-lon">경도(Lon)</th>
            <th id="th-status">상태</th>
          </tr>
        </thead>
        <tbody id="coordsTable">
          <!-- 스크립트에서 자동 생성 -->
        </tbody>
      </table>
    </div>

    <!-- 수학적 원리 정보 -->
    <div class="card">
      <h2 id="t-math-title">수학적 원리 및 투영 공식</h2>
      <div class="math-info" id="t-math-content">
        <!-- 언어별 동적 렌더링 -->
      </div>
    </div>
  </div>
</main>

<script>
// 다국어 번역 딕셔너리
const i18n = {
  ko: {
    title: "지구 구면직각삼각형 8대 중심점 모니터링",
    subtitle: "북위/남위 35.26° & 동경/서경 45°, 135° 기준 회전 변환 및 평면 투영 모델",
    liveLabel: "실시간 추적 중:",
    mapTitle: "세계 지도 투영 (북위 35°, 동경 45° 회전 관점)",
    pointsCount: "● 8개 중심점 표시 중",
    tableTitle: "구면직각삼각형 중심점 8곳 GPS",
    thZone: "구역",
    thLat: "위도(Lat)",
    thLon: "경도(Lon)",
    thStatus: "상태",
    statusNormal: "정상",
    centerLabel: "지도 중심 (35°N, 45°E)",
    mathTitle: "수학적 원리 및 투영 공식",
    mathContent: `
      <strong>1. 3D 공간 회전 변환 (Rotation Matrix)</strong>
      <div class="math-eq">
        r = [cosφ cosλ, cosφ sinλ, sinφ]ᵀ<br>
        p′ = R · p
      </div>
      지구 표면의 위치를 3차원 직교 좌표계 벡터로 변환 후, 기준 중심점(35°N, 45°E)을 지도의 중심축으로 회전시킵니다.
      <br><br><strong>2. 기존 위도선의 평면 곡선 방정식</strong>
      <div class="math-eq">
        cos(35°)Y + sin(35°)√(1 - X² - Y²) = sin(φ)
      </div>
      직교 투영 시 기존 위도선은 멀어질수록 양 끝이 위로 휘어지는 포물선($Y \\approx aX² + b$) 형태를 띱니다.
      <br><br><strong>3. 경도선 대원 구조 유지</strong>
      <p style="margin:4px 0 0;">
        동경 135°와 서경 45°($135°E \\leftrightarrow 45°W$) 축은 회전 후에도 휘어지지 않고 완전한 대원(Great Circle) 구조를 유지합니다.
      </p>
    `,
    centers: [
      { name: "C1 (북동1)" }, { name: "C2 (북동2)" },
      { name: "C3 (북서1)" }, { name: "C4 (북서2)" },
      { name: "C5 (남동1)" }, { name: "C6 (남동2)" },
      { name: "C7 (남서1)" }, { name: "C8 (남서2)" }
    ]
  },
  en: {
    title: "Spherical Right Triangle 8 Centers Monitoring",
    subtitle: "Rotation Matrix & Planar Projection based on 35.26° N/S & 45°/135° E/W",
    liveLabel: "Live Tracking:",
    mapTitle: "World Map Projection (Rotated View: 35°N, 45°E)",
    pointsCount: "● Displaying 8 Centers",
    tableTitle: "GPS Coordinates of 8 Center Points",
    thZone: "Zone",
    thLat: "Latitude",
    thLon: "Longitude",
    thStatus: "Status",
    statusNormal: "Active",
    centerLabel: "Map Center (35°N, 45°E)",
    mathTitle: "Mathematical Principles & Projection",
    mathContent: `
      <strong>1. 3D Spatial Rotation Matrix</strong>
      <div class="math-eq">
        r = [cosφ cosλ, cosφ sinλ, sinφ]ᵀ<br>
        p′ = R · p
      </div>
      Converts surface coordinates into 3D Cartesian vectors and rotates the center point (35°N, 45°E) to the map axis.
      <br><br><strong>2. Planar Curve Equation of Latitude Lines</strong>
      <div class="math-eq">
        cos(35°)Y + sin(35°)√(1 - X² - Y²) = sin(φ)
      </div>
      In orthographic projection, latitude lines curve upward as parabolic shapes ($Y \\approx aX² + b$).
      <br><br><strong>3. Preservation of Great Circles</strong>
      <p style="margin:4px 0 0;">
        Longitudes $135°E \\leftrightarrow 45°W$ maintain an uncurved Great Circle structure after rotation.
      </p>
    `,
    centers: [
      { name: "C1 (NE1)" }, { name: "C2 (NE2)" },
      { name: "C3 (NW1)" }, { name: "C4 (NW2)" },
      { name: "C5 (SE1)" }, { name: "C6 (SE2)" },
      { name: "C7 (SW1)" }, { name: "C8 (SW2)" }
    ]
  },
  vi: {
    title: "Giám Sát 8 Tâm Tam Giác Vuông Cầu Của Trái Đất",
    subtitle: "Mô hình biến đổi quay & phép chiếu phẳng dựa trên 35.26° B/N & 45°/135° Đ/T",
    liveLabel: "Theo dõi trực tiếp:",
    mapTitle: "Phép Chiếu Bản Đồ Thế Giới (Góc quay: 35°B, 45°Đ)",
    pointsCount: "● Đang hiển thị 8 điểm tâm",
    tableTitle: "Tọa Độ GPS 8 Điểm Tâm Tam Giác Cầu",
    thZone: "Khu vực",
    thLat: "Vĩ độ (Lat)",
    thLon: "Kinh độ (Lon)",
    thStatus: "Trạng thái",
    statusNormal: "Hoạt động",
    centerLabel: "Tâm bản đồ (35°B, 45°Đ)",
    mathTitle: "Nguyên Lý Toán Học & Phép Chiếu",
    mathContent: `
      <strong>1. Ma Trận Quay Không Gian 3D</strong>
      <div class="math-eq">
        r = [cosφ cosλ, cosφ sinλ, sinφ]ᵀ<br>
        p′ = R · p
      </div>
      Chuyển đổi tọa độ bề mặt thành vectơ Cartesian 3D và xoay điểm trung tâm (35°B, 45°Đ) làm trục bản đồ.
      <br><br><strong>2. Phương Trình Đường Cong Vĩ Độ</strong>
      <div class="math-eq">
        cos(35°)Y + sin(35°)√(1 - X² - Y²) = sin(φ)
      </div>
      Trong phép chiếu chính vuông, các đường vĩ độ cong lên phía trên theo dạng parabol ($Y \\approx aX² + b$).
      <br><br><strong>3. Duy Trì Cấu Trúc Vòng Tròn Lớn</strong>
      <p style="margin:4px 0 0;">
        Các kinh tuyến $135°Đ \\leftrightarrow 45°T$ giữ nguyên cấu trúc Vòng Tròn Lớn (Great Circle) không bị uốn cong sau khi quay.
      </p>
    `,
    centers: [
      { name: "C1 (ĐB1)" }, { name: "C2 (ĐB2)" },
      { name: "C3 (TB1)" }, { name: "C4 (TB2)" },
      { name: "C5 (ĐN1)" }, { name: "C6 (ĐN2)" },
      { name: "C7 (TN1)" }, { name: "C8 (TN2)" }
    ]
  }
};

let currentLang = "ko";

const LAT_VAL = 35.2644;
const baseCenters = [
  { id: 1, lat:  LAT_VAL, lon:  45.0 },
  { id: 2, lat:  LAT_VAL, lon: 135.0 },
  { id: 3, lat:  LAT_VAL, lon: -45.0 },
  { id: 4, lat:  LAT_VAL, lon:-135.0 },
  { id: 5, lat: -LAT_VAL, lon:  45.0 },
  { id: 6, lat: -LAT_VAL, lon: 135.0 },
  { id: 7, lat: -LAT_VAL, lon: -45.0 },
  { id: 8, lat: -LAT_VAL, lon:-135.0 }
];

const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");
const D2R = Math.PI / 180;

function changeLanguage(langKey) {
  currentLang = langKey;
  const dict = i18n[langKey];

  document.getElementById("t-title").textContent = dict.title;
  document.getElementById("t-subtitle").textContent = dict.subtitle;
  document.getElementById("t-live-label").textContent = dict.liveLabel;
  document.getElementById("t-map-title").innerHTML = `<strong>${dict.mapTitle}</strong>`;
  document.getElementById("t-points-count").textContent = dict.pointsCount;
  document.getElementById("t-table-title").textContent = dict.tableTitle;
  document.getElementById("th-zone").textContent = dict.thZone;
  document.getElementById("th-lat").textContent = dict.thLat;
  document.getElementById("th-lon").textContent = dict.thLon;
  document.getElementById("th-status").textContent = dict.thStatus;
  document.getElementById("t-math-title").textContent = dict.mathTitle;
  document.getElementById("t-math-content").innerHTML = dict.mathContent;

  initTable();
}

function initTable() {
  const tbody = document.getElementById("coordsTable");
  const dict = i18n[currentLang];
  tbody.innerHTML = "";

  baseCenters.forEach((c, idx) => {
    const latPrefix = c.lat >= 0 ? "N" : "S";
    const lonPrefix = c.lon >= 0 ? "E" : "W";
    const latStr = `${latPrefix} ${Math.abs(c.lat).toFixed(2)}°`;
    const lonStr = `${lonPrefix} ${Math.abs(c.lon).toFixed(2)}°`;
    const name = dict.centers[idx].name;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td class="center-name">${name}</td>
      <td class="coord-val">${latStr}</td>
      <td class="coord-val">${lonStr}</td>
      <td><span style="color:var(--green)">● ${dict.statusNormal}</span></td>
    `;
    tbody.appendChild(row);
  });
}

const centerLat = 35.0 * D2R;
const centerLon = 45.0 * D2R;

function projectPoint(latDeg, lonDeg, width, height) {
  let phi = latDeg * D2R;
  let lam = lonDeg * D2R;

  let x = Math.cos(phi) * Math.cos(lam);
  let y = Math.cos(phi) * Math.sin(lam);
  let z = Math.sin(phi);

  let x1 = x * Math.cos(-centerLon) - y * Math.sin(-centerLon);
  let y1 = x * Math.sin(-centerLon) + y * Math.cos(-centerLon);
  let z1 = z;

  let x2 = x1 * Math.cos(-centerLat) + z1 * Math.sin(-centerLat);
  let y2 = y1;
  let z2 = -x1 * Math.sin(-centerLat) + z1 * Math.cos(-centerLat);

  let newLat = Math.asin(Math.max(-1, Math.min(1, z2)));
  let newLon = Math.atan2(y2, x2);

  let px = (width / 2) + (newLon / Math.PI) * (width * 0.42);
  let py = (height / 2) - (newLat / (Math.PI / 2)) * (height * 0.42);

  return { x: px, y: py };
}

function renderMap() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;

  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = "#13314d";
  ctx.lineWidth = 1;

  for (let lat = -60; lat <= 60; lat += 30) {
    ctx.beginPath();
    for (let lon = -180; lon <= 180; lon += 5) {
      let p = projectPoint(lat, lon, w, h);
      if (lon === -180) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  for (let lon = -180; lon < 180; lon += 45) {
    ctx.beginPath();
    for (let lat = -90; lat <= 90; lat += 5) {
      let p = projectPoint(lat, lon, w, h);
      if (lat === -90) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  let centerP = projectPoint(35, 45, w, h);
  ctx.fillStyle = "#ff6675";
  ctx.beginPath();
  ctx.arc(centerP.x, centerP.y, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.font = "12px sans-serif";
  ctx.fillText(i18n[currentLang].centerLabel, centerP.x + 10, centerP.y + 4);

  const now = Date.now() * 0.003;
  baseCenters.forEach((c, i) => {
    let p = projectPoint(c.lat, c.lon, w, h);
    let pulseSize = 6 + Math.sin(now + i) * 3;

    ctx.strokeStyle = "#ffd45a";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, pulseSize + 4, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "#ffd45a";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#4dd8ff";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(i18n[currentLang].centers[i].name, p.x + 10, p.y - 6);
  });
}

function loop() {
  const d = new Date();
  document.getElementById("liveTimer").textContent = d.toTimeString().split(" ")[0];
  renderMap();
  requestAnimationFrame(loop);
}

window.addEventListener("resize", renderMap);
changeLanguage("ko");
loop();
</script>
</body>
</html>
