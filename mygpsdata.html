<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰 로컬 위치 저장소</title>
    <!-- Leaflet 지도 라이브러리 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 16px; background-color: #f5f5f7; color: #333;
        }
        h2 { margin-top: 0; color: #1d1d1f; text-align: center; }
        .card {
            background: #fff; padding: 16px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px;
        }
        button {
            width: 100%; padding: 12px; background-color: #007aff; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 8px; transition: background 0.2s;
        }
        button:active { background-color: #0056b3; }
        input[type="text"] {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 8px; font-size: 15px; margin-top: 6px;
        }
        #map { width: 100%; height: 250px; border-radius: 8px; margin-top: 10px; }
        .info-text { font-size: 14px; color: #666; margin: 4px 0; }
        .file-input-wrapper {
            position: relative; overflow: hidden; display: inline-block; width: 100%;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer;
        }
        .btn-green { background-color: #34c759; }
        .btn-orange { background-color: #ff9500; }
        .copy-alert {
            background-color: #e3f2fd; color: #0d47a1; padding: 10px;
            border-radius: 6px; font-size: 13px; margin-top: 8px; text-align: center;
        }
    </style>
</head>
<body>

    <h2>📍 내 위치 로컬 DB 저장소</h2>

    <!-- 1. 위치 측정 영역 -->
    <div class="card">
        <h3>1. 현재 위치 가져오기</h3>
        <button onclick="getCurrentLocation()">현재 위치 확인하기</button>
        <div id="status" class="info-text" style="margin-top: 8px;"></div>
        <p class="info-text">위도(Lat): <span id="latitude">-</span></p>
        <p class="info-text">경도(Lng): <span id="longitude">-</span></p>
        <div id="map"></div>
    </div>

    <!-- 2. 파일 저장 영역 -->
    <div class="card">
        <h3>2. 휴대폰 경로 지정 저장하기</h3>
        <label for="fileName">저장할 파일 이름:</label>
        <input type="text" id="fileName" placeholder="예: my_location.json">
        <button class="btn-green" onclick="saveLocationWithPicker()">원하는 위치/폴더 선택하여 저장</button>
    </div>

    <!-- 3. 파일 불러오기 영역 -->
    <div class="card">
        <h3>3. 저장된 위치 파일 불러오기</h3>
        <div class="file-input-wrapper">
            <button class="btn-orange">기기에서 파일 선택 및 불러오기</button>
            <input type="file" id="fileLoader" accept=".json, .txt" onchange="loadLocationFromFile(event)">
        </div>
        <div id="loadedData" style="margin-top: 12px; font-size: 14px; color: #1d1d1f;"></div>
        <div id="copyNotice" class="copy-alert" style="display: none;"></div>
    </div>

    <script>
        let currentLat = null;
        let currentLng = null;
        let map = null;
        let marker = null;

        // Leaflet 지도 초기화 및 마커 표시
        function initMap(lat, lng) {
            if (!map) {
                map = L.map('map').setView([lat, lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);
                marker = L.marker([lat, lng]).addTo(map);
            } else {
                map.setView([lat, lng], 15);
                marker.setLatLng([lat, lng]);
            }
        }

        // GPS 위치 측정
        function getCurrentLocation() {
            const status = document.getElementById('status');
            if (!navigator.geolocation) {
                status.innerText = "이 브라우저에서는 위치 서비스를 지원하지 않습니다.";
                return;
            }

            status.innerText = "위치를 측정하는 중입니다...";
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;

                    document.getElementById('latitude').innerText = currentLat;
                    document.getElementById('longitude').innerText = currentLng;
                    status.innerText = "위치 수신 완료!";

                    initMap(currentLat, currentLng);
                },
                (error) => {
                    status.innerText = "위치를 가져오는데 실패했습니다: " + error.message;
                },
                { enableHighAccuracy: true }
            );
        }

        // 경로/폴더 지정하여 저장 (File System Access API)
        async function saveLocationWithPicker() {
            if (!currentLat || !currentLng) {
                alert("먼저 '현재 위치 확인하기' 버튼을 누르거나 파일을 불러와 좌표를 지정하세요.");
                return;
            }

            let fileName = document.getElementById('fileName').value.trim();
            if (!fileName) {
                fileName = "my_location.json";
            } else if (!fileName.endsWith('.json') && !fileName.endsWith('.txt')) {
                fileName += ".json";
            }

            const data = {
                latitude: currentLat,
                longitude: currentLng,
                savedAt: new Date().toLocaleString('ko-KR')
            };

            const jsonContent = JSON.stringify(data, null, 2);

            // 1. 최신 브라우저: 파일 저장 위치 선택 창(Save Picker) 띄우기
            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: fileName,
                        types: [{
                            description: 'JSON 위치 파일',
                            accept: { 'application/json': ['.json'] },
                        }],
                    });

                    const writable = await handle.createWritable();
                    await writable.write(jsonContent);
                    await writable.close();

                    alert(`선택한 위치에 '${fileName}' 파일이 성공적으로 저장되었습니다.`);
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') {
                        // 사용자가 파일 저장 창을 취소한 경우
                        return;
                    }
                    console.warn("Save File Picker 사용 중 오류, 일반 다운로드로 대체합니다.", err);
                }
            }

            // 2. 구형 브라우저 또는 미지원 모바일 브라우저 예비 로직 (기본 다운로드)
            const blob = new Blob([jsonContent], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
            URL.revokeObjectURL(link.href);

            alert(`'${fileName}' 파일 저장 명령을 실행했습니다.\n(스마트폰 다운로드 설정에 따라 경로 지정 창이 열리거나 다운로드 폴더로 저장됩니다.)`);
        }

        // 불러온 파일 처리 및 좌표 자동 복사 기능
        function loadLocationFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.latitude && data.longitude) {
                        currentLat = data.latitude;
                        currentLng = data.longitude;

                        // 화면 텍스트 업데이트
                        document.getElementById('latitude').innerText = currentLat;
                        document.getElementById('longitude').innerText = currentLng;
                        document.getElementById('loadedData').innerHTML = 
                            `<b>불러온 파일:</b> ${file.name}<br>` +
                            `<b>저장 시각:</b> ${data.savedAt || '기록 없음'}`;

                        // 지도 이동
                        initMap(currentLat, currentLng);

                        // 좌표 클립보드 자동 복사
                        const gpsString = `${currentLat}, ${currentLng}`;
                        copyToClipboard(gpsString);

                    } else {
                        alert("올바른 위치 데이터 형식(JSON)이 아닙니다.");
                    }
                } catch (err) {
                    alert("파일을 읽는 중 오류가 발생했습니다.");
                }
            };
            reader.readAsText(file);
        }

        // 클립보드 복사 함수
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showNotice(`📋 GPS 좌표가 클립보드에 자동 복사되었습니다!\n(${text})`);
                }).catch(() => {
                    fallbackCopyTextToClipboard(text);
                });
            } else {
                fallbackCopyTextToClipboard(text);
            }
        }

        // 구형 브라우저 호환 복사 로직
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showNotice(`📋 GPS 좌표가 클립보드에 자동 복사되었습니다!\n(${text})`);
            } catch (err) {
                showNotice("자동 복사에 실패했습니다. 좌표를 수동으로 복사해주세요.");
            }
            document.body.removeChild(textArea);
        }

        // 알림 메시지 출력
        function showNotice(msg) {
            const noticeEl = document.getElementById('copyNotice');
            noticeEl.innerText = msg;
            noticeEl.style.display = 'block';
        }
    </script>
</body>
</html>
